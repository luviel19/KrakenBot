# Пересылает проверки Let's Encrypt для API бота в Caddy (127.0.0.1:8088).
# Остальные сайты nginx не затрагивает. Положить в /etc/nginx/conf.d/krakenbot-acme.conf
server {
    listen 80;
    listen [::]:80;
    server_name 45-134-217-51.sslip.io;

    location /.well-known/acme-challenge/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
