services:
  bot:
    image: ghcr.io/luviel19/krakenbot:latest
    restart: unless-stopped
    env_file: .env
    # API наружу не открыт: к нему обращаются только через HTTPS-прокси caddy
    expose:
      - "8080"
    volumes:
      - bot-data:/data

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    depends_on:
      - bot
    environment:
      API_DOMAIN: ${API_DOMAIN}
      API_HTTPS_PORT: ${API_HTTPS_PORT:-47821}
    ports:
      # HTTP только для проверок Let's Encrypt: порт 80 занят nginx, он пересылает их сюда
      # (порт на сервере меняется через ACME_LOCAL_PORT в .env, в nginx-acme.conf должен быть тот же)
      - "127.0.0.1:${ACME_LOCAL_PORT:-47880}:8088"
      - "${API_HTTPS_PORT:-47821}:${API_HTTPS_PORT:-47821}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  bot-data:
  caddy-data:
  caddy-config:
