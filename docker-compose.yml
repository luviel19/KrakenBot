services:
  bot:
    image: ghcr.io/luviel19/krakenbot:latest
    restart: unless-stopped
    env_file: .env
    ports:
      # API новостей для сайта; порт снаружи меняется через API_PUBLIC_PORT в .env
      - "${API_PUBLIC_PORT:-8080}:8080"
    volumes:
      - bot-data:/data

volumes:
  bot-data:
